<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <style>
    .entity { fill: #fff7d6; stroke: #222; stroke-width: 2; }
    .assoc { fill: #e8f1ff; stroke: #222; stroke-width: 2; }
    .title { font: 700 20px Arial, sans-serif; }
    .text { font: 16px Arial, sans-serif; }
    .small { font: 14px Arial, sans-serif; }
    .card { font: 700 16px Arial, sans-serif; fill: #c1121f; }
    .line { stroke: #222; stroke-width: 2; fill: none; }
  </style>

  <text x="40" y="42" class="title">MCD - Blog Clutch Time Media</text>

  <!-- AUTEUR -->
  <rect x="60" y="160" width="260" height="190" rx="4" class="entity"/>
  <text x="88" y="195" class="title">AUTEUR</text>
  <line x1="60" y1="210" x2="320" y2="210" class="line"/>
  <text x="88" y="240" class="text"><tspan text-decoration="underline">id_auteur</tspan></text>
  <text x="88" y="268" class="text">prenom</text>
  <text x="88" y="296" class="text">nom</text>
  <text x="88" y="324" class="text">email</text>

  <!-- ARTICLE -->
  <rect x="510" y="145" width="300" height="260" rx="4" class="entity"/>
  <text x="622" y="180" class="title">ARTICLE</text>
  <line x1="510" y1="195" x2="810" y2="195" class="line"/>
  <text x="540" y="225" class="text"><tspan text-decoration="underline">id_article</tspan></text>
  <text x="540" y="253" class="text">titre</text>
  <text x="540" y="281" class="text">sous_titre</text>
  <text x="540" y="309" class="text">resume</text>
  <text x="540" y="337" class="text">contenu</text>
  <text x="540" y="365" class="text">image</text>
  <text x="540" y="393" class="text">date_parution</text>

  <!-- CATEGORIE -->
  <rect x="510" y="20" width="300" height="100" rx="4" class="entity"/>
  <text x="596" y="54" class="title">CATEGORIE</text>
  <line x1="510" y1="68" x2="810" y2="68" class="line"/>
  <text x="540" y="94" class="text"><tspan text-decoration="underline">id_categorie</tspan> | nom | slug</text>

  <!-- COMMENTAIRE -->
  <rect x="510" y="575" width="300" height="145" rx="4" class="entity"/>
  <text x="575" y="610" class="title">COMMENTAIRE</text>
  <line x1="510" y1="625" x2="810" y2="625" class="line"/>
  <text x="540" y="655" class="text"><tspan text-decoration="underline">id_commentaire</tspan></text>
  <text x="540" y="683" class="text">contenu</text>
  <text x="540" y="711" class="text">date_creation</text>

  <!-- TAG -->
  <rect x="960" y="210" width="240" height="115" rx="4" class="entity"/>
  <text x="1050" y="245" class="title">TAG</text>
  <line x1="960" y1="260" x2="1200" y2="260" class="line"/>
  <text x="988" y="290" class="text"><tspan text-decoration="underline">id_tag</tspan> | nom | slug</text>

  <!-- Associations -->
  <polygon points="390,242 450,282 390,322 330,282" class="assoc"/>
  <text x="358" y="288" class="text">REDIGER</text>

  <polygon points="660,440 735,490 660,540 585,490" class="assoc"/>
  <text x="622" y="496" class="text">RECEVOIR</text>

  <polygon points="380,520 450,565 380,610 310,565" class="assoc"/>
  <text x="347" y="571" class="text">ECRIRE</text>

  <polygon points="660,120 735,145 660,170 585,145" class="assoc"/>
  <text x="625" y="151" class="text">CLASSER</text>

  <polygon points="885,242 955,282 885,322 815,282" class="assoc"/>
  <text x="846" y="288" class="text">ETIQUETER</text>

  <!-- Lines and cardinalities -->
  <line x1="320" y1="282" x2="330" y2="282" class="line"/>
  <line x1="450" y1="282" x2="510" y2="282" class="line"/>
  <text x="332" y="268" class="card">0,n</text>
  <text x="475" y="268" class="card">1,1</text>

  <line x1="660" y1="120" x2="660" y2="145" class="line"/>
  <line x1="660" y1="170" x2="660" y2="195" class="line"/>
  <text x="674" y="136" class="card">0,n</text>
  <text x="674" y="188" class="card">1,1</text>

  <line x1="660" y1="405" x2="660" y2="440" class="line"/>
  <line x1="660" y1="540" x2="660" y2="575" class="line"/>
  <text x="674" y="430" class="card">0,n</text>
  <text x="674" y="565" class="card">1,1</text>

  <line x1="245" y1="350" x2="380" y2="520" class="line"/>
  <line x1="450" y1="565" x2="510" y2="650" class="line"/>
  <text x="275" y="400" class="card">0,n</text>
  <text x="472" y="615" class="card">1,1</text>

  <line x1="810" y1="282" x2="815" y2="282" class="line"/>
  <line x1="955" y1="282" x2="960" y2="282" class="line"/>
  <text x="820" y="268" class="card">0,n</text>
  <text x="925" y="268" class="card">0,n</text>

  <text x="60" y="770" class="small">Lecture : un ARTICLE appartient a une seule CATEGORIE, mais une CATEGORIE peut classer plusieurs ARTICLES.</text>
  <text x="60" y="795" class="small">La relation ARTICLE - TAG est en plusieurs-a-plusieurs : elle deviendra une table d'association dans le MLD.</text>
</svg>
