<!DOCTYPE html>
<html lang="fr">

<head>
  <!-- Configuration de base : encodage, affichage mobile, titre, style et favicon. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article - Clutch Time Media</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
</head>

<body>
  <!-- En-tête commun : accès aux pages principales depuis le détail d'un article. -->
  <header class="header">
    <div class="container nav-container">
      <a href="../../index.html" class="logo">
        <img src="../img/logo.svg" alt="Logo Clutch Time Media" />
      </a>

      <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="../../index.html">ACCUEIL</a></li>
          <li><a href="./articles.html">ARTICLES</a></li>
          <li><a href="./contact.html">CONTACT</a></li>
        </ul>

        <div class="nav-buttons">
          <a href="./connexion.html" class="btn btn-blue">SE CONNECTER</a>
          <a href="./inscription.html" class="btn btn-blue">S'INSCRIRE</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Bannière visuelle du détail article. -->
  <section class="article-banner">
    <div class="article-banner-overlay"></div>
    <h1>ARTICLE</h1>
  </section>

  <!-- Zone dynamique : article-detail.js charge l'article, ses commentaires et le formulaire. -->
  <main class="article-page">
    <section class="article-section">
      <article class="article-card">
        <div class="article-placeholder">
          <p class="empty-state">Chargement de l'article...</p>
        </div>
      </article>
    </section>
  </main>

  <!-- Pied de page commun. -->
  <footer class="footer">
    <div class="container">
      <p>3 rue des basketteurs, 5500 LAL | 55-55-55-55 | clutchtimemedia@contact.fr</p>
      <p>Copyright 2026 Clutch Time Media</p>
    </div>
  </footer>

  <!-- Scripts : accès API, menu responsive, puis rendu du détail et des commentaires. -->
  <script src="../js/articles.service.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/article-detail.js"></script>
</body>

</html>
