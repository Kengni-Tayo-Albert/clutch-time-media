<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer un article - Clutch Time Media</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container nav-container">
      <a href="../../index.html" class="logo">
        <img src="../img/logo.svg" alt="Logo Clutch Time Media" />
      </a>
      <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="../../index.html">ACCUEIL</a></li>
          <li><a href="../../assets/pages/articles.html">ARTICLES</a></li>
          <li><a href="contact.html">CONTACT</a></li>
        </ul>

        <div class="nav-buttons">
          <a href="connexion.html" class="btn btn-blue">SE CONNECTER</a>
          <a href="inscription.html" class="btn btn-blue">S’INSCRIRE</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- BANNIERE -->
  <section class="create-banner">
    <div class="create-banner-overlay"></div>
    <h1>CRÉER UN ARTICLE</h1>
  </section>

  <!-- FORMULAIRE -->
  <main class="create-page">
    <section class="create-section">
      <div class="create-card">
        <form class="create-form" id="create-article-form">

          <div class="form-group">
            <label for="title">Titre de l’article</label>
            <input type="text" id="title" name="title" />
          </div>

          <div class="form-group">
            <label for="subtitle">Sous-titre de l’article</label>
            <input type="text" id="subtitle" name="subtitle" />
          </div>

          <div class="form-group">
            <label for="summary">Résumé</label>
            <textarea id="summary" name="summary" class="textarea-small"></textarea>
          </div>

          <div class="form-group">
            <label for="author">Nom de l’auteur</label>
            <input type="text" id="author" name="author" />
          </div>

          <div class="form-group">
            <label for="date">Date de création</label>
            <input type="text" id="date" name="date" />
          </div>

          <div class="form-group">
            <label for="reading-time">Temps de lecture</label>
            <input type="text" id="reading-time" name="reading-time" />
          </div>

          <div class="form-group">
            <label for="content">Contenu de l’article</label>
            <textarea id="content" name="content" class="textarea-large"></textarea>
          </div>

          <div class="form-submit">
            <button type="submit" class="btn btn-blue">Publier</button>
          </div>

        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>3 rue des basketteurs, 5500 LAL | 55-55-55-55 | clutchtimemedia@contact.fr</p>
      <p>Copyright©2026 Clutch Time Media</p>
    </div>
  </footer>

  <script src="../js/articles.service.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/create-article.js"></script>
</body>

</html>
