<!DOCTYPE html>
<html lang="fr">

<head>
  <!-- Configuration de base : encodage, affichage mobile, titre, style et favicon. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles - Clutch Time Media</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
</head>

<body>
  <!-- En-tête commun : conserve la même navigation sur tout le site. -->
  <header class="header">
    <div class="container nav-container">
      <a href="../../index.html" class="logo">
        <img src="../img/logo.svg" alt="Logo Clutch Time Media" />
      </a>

      <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="../../index.html">ACCUEIL</a></li>
          <li><a href="./articles.html">ARTICLES</a></li>
          <li><a href="./contact.html">CONTACT</a></li>
        </ul>

        <div class="nav-buttons">
          <a href="./connexion.html" class="btn btn-blue">SE CONNECTER</a>
          <a href="./inscription.html" class="btn btn-blue">S'INSCRIRE</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Bannière de page : indique que cette page affiche les actualités du blog. -->
  <section class="banner">
    <h1>ACTUALITES</h1>
  </section>

  <!-- Conteneur dynamique : articles-page.js remplace le chargement par les cartes articles. -->
  <main class="articles">
    <section class="container articles-list-grid" id="articles-list">
      <p class="empty-state">Chargement des articles...</p>
    </section>
  </main>

  <!-- Pied de page commun. -->
  <footer class="footer">
    <div class="container">
      <p>3 rue des basketteurs, 5500 LAL | 55-55-55-55 | clutchtimemedia@contact.fr</p>
      <p>Copyright 2026 Clutch Time Media</p>
    </div>
  </footer>

  <!-- Scripts : ArticleService appelle l'API SQL, articles-page.js affiche la liste. -->
  <script src="../js/articles.service.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/articles-page.js"></script>
</body>

</html>
