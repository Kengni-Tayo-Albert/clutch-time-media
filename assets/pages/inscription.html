<!DOCTYPE html>
<html lang="fr">

<head>
  <!-- Configuration de base : encodage, affichage mobile, titre, style et favicon. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription - Clutch Time Media</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon.png">
</head>

<body>
  <!-- En-tête commun : logo et navigation globale. -->
  <header class="header">
    <div class="container nav-container">
      <a href="../../index.html" class="logo">
        <img src="../img/logo.svg" alt="Logo Clutch Time Media" />
      </a>

      <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="../../index.html">ACCUEIL</a></li>
          <li><a href="./articles.html">ARTICLES</a></li>
          <li><a href="./contact.html">CONTACT</a></li>
        </ul>

        <div class="nav-buttons">
          <a href="./connexion.html" class="btn btn-blue">SE CONNECTER</a>
          <a href="./inscription.html" class="btn btn-blue">S'INSCRIRE</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Bannière d'inscription : présente l'entrée dans la communauté du média. -->
  <section class="signup-banner">
    <div class="signup-banner-overlay"></div>
    <h1>
      <span class="white-text">REJOIGNEZ</span>
      <span class="red-text">CLUTCH TIME MEDIA</span>
    </h1>
  </section>

  <!-- Formulaire d'inscription de démonstration : accès ensuite à la création d'article. -->
  <main class="signup-page">
    <section class="signup-section">
      <div class="signup-card">
        <form class="signup-form">
          <div class="form-group">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" name="lastname" required />
          </div>

          <div class="form-group">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" name="firstname" required />
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" required />
          </div>

          <div class="form-group">
            <label for="signup-password">Mot de passe</label>
            <input type="password" id="signup-password" name="password" required />
          </div>

          <div class="form-submit">
            <a href="./creation-article.html" class="btn btn-blue">Créer un compte</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Pied de page commun. -->
  <footer class="footer">
    <div class="container">
      <p>3 rue des basketteurs, 5500 LAL | 55-55-55-55 | clutchtimemedia@contact.fr</p>
      <p>Copyright 2026 Clutch Time Media</p>
    </div>
  </footer>

  <!-- Script commun pour le menu responsive. -->
  <script src="../js/main.js"></script>
</body>

</html>
