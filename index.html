<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clutch Time Media</title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon.png">
</head>

<body>
  <header class="header">
    <div class="container nav-container">
      <a href="./index.html" class="logo">
        <img src="./assets/img/logo.svg" alt="Logo Clutch Time Media" />
      </a>

      <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="./index.html">ACCUEIL</a></li>
          <li><a href="./assets/pages/articles.html">ARTICLES</a></li>
          <li><a href="./assets/pages/contact.html">CONTACT</a></li>
        </ul>

        <div class="nav-buttons">
          <a href="./assets/pages/connexion.html" class="btn btn-blue">SE CONNECTER</a>
          <a href="./assets/pages/inscription.html" class="btn btn-blue">S'INSCRIRE</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>VIBREZ AU RYTHME DE LA NBA !</h1>

        <div class="hero-banner">
          <img src="./assets/img/hero-section.svg" alt="Joueurs NBA" />

        </div>
      </div>
    </section>

    <section class="featured">
      <div class="container">
        <h2>A LA UNE</h2>

        <div class="slider-wrapper">
          <button class="arrow arrow-left" aria-label="Article precedent">&#10094;</button>

          <div class="articles-grid" id="home-carousel-track">
            <p class="empty-state">Chargement des articles...</p>
          </div>

          <button class="arrow arrow-right" aria-label="Article suivant">&#10095;</button>
        </div>

        <div class="dots" id="home-carousel-dots" aria-label="Navigation du carrousel"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>3 rue des basketteurs, 5500 LAL | 55-55-55-55 | clutchtimemedia@contact.fr</p>
      <p>Copyright 2026 Clutch Time Media</p>
    </div>
